<!doctype html>
<html lang="en" class="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>Nura — Messenger</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css">
    <link rel="stylesheet" href="style.css" />

</head>

<body>
    <div id="app" class="app-shell"></div>
    <div id="toast" class="toast"></div>
    <script>
        const API = 'api.php';
        const S = { me: null, authMode: 'login', tab: 'chats', view: 'main', search: '', chats: [], users: [], activeChat: null, messages: [], replyTo: null, editing: null, emoji: false, poll: null, recording: null, recordChunks: [], recordTimer: null, recordStarted: null };
        const $ = s => document.querySelector(s); const esc = v => String(v ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
        const logo = `<img src="logo.png" alt="Nura" onerror="this.style.display='none';this.parentElement.querySelector('.brand-fallback')?.classList.remove('hidden')">`;
        function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2200) }
        function api(action, opt = {}) { const url = new URL(API, location.href); url.searchParams.set('action', action); if (opt.qs) Object.entries(opt.qs).forEach(([k, v]) => url.searchParams.set(k, v)); return fetch(url, { credentials: 'same-origin', ...opt }).then(async r => { let x = {}; try { x = await r.json() } catch { } if (!r.ok || x.ok === false) throw new Error(x.error || 'Request failed'); return x }) }
        function initials(u) { return esc((u?.display_name || u?.username || 'N').slice(0, 1).toUpperCase()) }
        function avatar(u, cl = 'av-md') { const live = u?.last_seen && Date.now() - Date.parse(u.last_seen) < 120000; return `<div style="position:relative;width:max-content"><div class="avatar ${cl}">${initials(u)}${u?.avatar_url ? `<img src="${esc(u.avatar_url)}" alt="">` : ''}</div>${live ? '<span class="online-dot"></span>' : ''}</div>` }
        function time(x) { if (!x) return ''; const d = new Date(x), n = new Date(); if (d.toDateString() === n.toDateString()) return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) }
        function dateLabel(x) { const d = new Date(x), n = new Date(); if (d.toDateString() === n.toDateString()) return 'Today'; return d.toLocaleDateString([], { month: 'short', day: 'numeric', year: d.getFullYear() !== n.getFullYear() ? 'numeric' : undefined }) }
        function authView() { return `<div class="auth"><div class="brand-mark">${logo}<span class="brand-fallback hidden">N</span></div><div><h1>Nura</h1><p class="auth-sub">A softer kind of messenger. Private conversations, expressive profiles and little moments that feel alive.</p></div><div class="auth-card">${S.authMode === 'login' ? loginForm() : registerForm()}</div><div class="auth-switch">${S.authMode === 'login' ? `New to Nura? <button class="link" onclick="S.authMode='register';render()">Create account</button>` : `Already here? <button class="link" onclick="S.authMode='login';render()">Sign in</button>`}</div></div>` }
        function loginForm() { return `<form onsubmit="login(event)"><div class="field"><label>Username</label><input id="login-id" required autocomplete="username" placeholder="your_username"></div><div class="field"><label>Password</label><div class="password-wrap"><input id="login-pw" type="password" required autocomplete="current-password" placeholder="••••••••"><button type="button" onclick="togglePw('login-pw',this)"><i class="ri-eye-line"></i></button></div></div><button class="btn primary" style="width:100%">Sign in <i class="ri-arrow-right-line"></i></button><p class="muted" style="font-size:10px;text-align:center;margin:12px 0 0">Demo account: demo / Nura12345</p></form>` }
        function registerForm() { return `<form onsubmit="register(event)"><div class="field"><label>Username</label><input id="reg-user" required minlength="3" maxlength="24" placeholder="amir_01"></div><div class="field"><label>Display name</label><input id="reg-name" required placeholder="Amir"></div><div class="field"><label>Password</label><div class="password-wrap"><input id="reg-pw" type="password" required minlength="8" placeholder="At least 8 characters"><button type="button" onclick="togglePw('reg-pw',this)"><i class="ri-eye-line"></i></button></div></div><div class="field"><label>Bio</label><textarea id="reg-bio" placeholder="A little about you..."></textarea></div><button class="btn primary" style="width:100%">Create Nura account <i class="ri-sparkling-2-line"></i></button></form>` }
        function shell() { return `<div class="page">${S.tab === 'chats' ? chatList() : S.tab === 'discover' ? discover() : profile()}${bottom()}${S.tab === 'chats' ? `<button class="fab" onclick="openNewChat()" aria-label="New chat"><i class="ri-chat-new-line"></i></button>` : ''}</div>` }
        function bottom() { return `<nav class="bottom glass safe-bottom"><button class="navbtn ${S.tab === 'chats' ? 'active' : ''}" onclick="go('chats')"><i class="ri-message-3-${S.tab === 'chats' ? 'fill' : 'line'} icon"></i><span>Chats</span></button><button class="navbtn ${S.tab === 'discover' ? 'active' : ''}" onclick="go('discover')"><i class="ri-compass-3-${S.tab === 'discover' ? 'fill' : 'line'} icon"></i><span>Discover</span></button><button class="navbtn ${S.tab === 'profile' ? 'active' : ''}" onclick="go('profile')">${avatar(S.me, 'av-xs')}<span>Profile</span></button></nav>` }
        function chatList() { return `<header class="topbar glass safe-top"><div class="toprow"><div class="brand"><div class="brand-logo">${logo}<span class="brand-fallback hidden">N</span></div><div><strong>Nura</strong><div class="sub">Messages, but more you.</div></div></div><div style="display:flex;gap:7px"><button class="iconbtn" onclick="refreshChats()" title="Refresh"><i class="ri-refresh-line"></i></button><button class="iconbtn" onclick="openNewChat()" title="New chat"><i class="ri-edit-2-line"></i></button></div></div><div class="search"><i class="ri-search-line muted"></i><input value="${esc(S.search)}" oninput="S.search=this.value;renderChatRows()" placeholder="Search chats"></div></header><section class="page-head"><div class="eyebrow">MESSAGES</div><div class="title">Your conversations</div><div class="subtitle">Private by default. Social when you want it.</div></section><main id="chatRows" class="chat-list"></main>` }
        function renderChatRows() { const root = $('#chatRows'); if (!root) return; const rows = S.chats.filter(c => { const n = c.other?.display_name || c.title || ''; const b = c.last_body || ''; return !S.search || `${n} ${b}`.toLowerCase().includes(S.search.toLowerCase()) }); root.innerHTML = rows.length ? rows.map(c => `<button class="chat-row" onclick="openChat(${c.id})">${avatar(c.other || { display_name: c.title }, 'av-md')}<div class="meta"><div class="chat-line"><div class="chat-name">${esc(c.other?.display_name || c.title || 'Conversation')}</div><div class="chat-time">${time(c.last_message_at || c.created_at)}</div></div><div class="chat-line"><div class="last">${c.last_type === 'image' ? '📷 Photo' : c.last_type === 'file' ? '📎 File' : c.last_type === 'audio' ? '🎙 Voice message' : esc(c.last_body || 'Start a conversation')}</div>${c.unread ? `<span class="badge">${c.unread > 99 ? '99+' : c.unread}</span>` : ''}</div></div></button>`).join('') : `<div class="empty"><i class="ri-message-3-line"></i><h3>No conversations yet</h3><p>Tap the new chat button and find someone on Nura.</p></div>` }
        function discover() { return `<section class="page-head" style="padding-top:18px"><div class="eyebrow">DISCOVER</div><div class="title">People you may like</div><div class="subtitle">Find someone by display name or @username and start a private chat.</div><div class="search" style="margin-top:14px"><i class="ri-user-search-line muted"></i><input oninput="searchUsers(this.value)" placeholder="Search people"></div></section><main class="people" id="users"><div class="empty"><i class="ri-user-search-line"></i><h3>Find someone</h3><p>Search by name or username.</p></div></main>` }
        async function searchUsers(q) { const el = $('#users'); if (!el) return; if (!q.trim()) { el.innerHTML = '<div class="empty"><i class="ri-user-search-line"></i><h3>Find someone</h3><p>Search by name or username.</p></div>'; return } try { const r = await api('search_users', { qs: { q } }); S.users = r.users || []; el.innerHTML = S.users.length ? S.users.map(u => `<button class="person" onclick="startChat(${u.id})">${avatar(u, 'av-md')}<div class="grow"><div class="person-name">${esc(u.display_name)}</div><div class="handle">@${esc(u.username)}</div></div><span class="profile-chip">Message</span></button>`).join('') : '<div class="empty"><i class="ri-search-eye-line"></i><h3>No people found</h3><p>Try another name or username.</p></div>' } catch (e) { toast(e.message) } }
        function profile() { const u = S.me || {}; return `<section class="profile"><div class="profile-hero"><div class="banner">${u.banner_url ? `<img src="${esc(u.banner_url)}" alt="">` : ''}</div><div class="profile-head"><div class="profile-avatar-wrap"><div class="profile-avatar">${u.avatar_url ? `<img src="${esc(u.avatar_url)}" alt="">` : `<span style="font-size:30px">${initials(u)}</span>`}</div><span class="profile-status"></span></div><div class="profile-name">${esc(u.display_name || 'Your name')}</div><div class="profile-handle">@${esc(u.username || 'username')}</div><p class="bio">${esc(u.bio || 'Tell people something about you.')}</p><div class="social-row">${u.instagram_url ? `<a class="social" href="${esc(u.instagram_url)}" target="_blank"><i class="ri-instagram-line"></i> Instagram</a>` : ''}${u.x_url ? `<a class="social" href="${esc(u.x_url)}" target="_blank"><i class="ri-twitter-x-line"></i> X</a>` : ''}${u.linkedin_url ? `<a class="social" href="${esc(u.linkedin_url)}" target="_blank"><i class="ri-linkedin-line"></i> LinkedIn</a>` : ''}${u.website_url ? `<a class="social" href="${esc(u.website_url)}" target="_blank"><i class="ri-global-line"></i> Website</a>` : ''}</div><div class="profile-actions"><button class="btn primary" onclick="openProfileEdit()"><i class="ri-edit-2-line"></i>Edit profile</button><button class="btn" style="background:rgba(255,255,255,.05)" onclick="logout()"><i class="ri-logout-box-r-line"></i>Sign out</button></div></div></div><div class="section"><div class="section-title"><span>Profile identity</span><span class="muted" style="font-size:10px">Nura</span></div><div class="settings-card"><div class="settings-row"><i class="ri-at-line"></i><div class="grow"><b>@${esc(u.username || '')}</b><small class="muted">Your public handle</small></div></div><div class="settings-row"><i class="ri-user-3-line"></i><div class="grow"><b>${esc(u.display_name || '')}</b><small class="muted">How people see you</small></div></div><div class="settings-row"><i class="ri-sparkling-line"></i><div class="grow"><b>Express yourself</b><small class="muted">Banner, avatar, bio and social links</small></div></div></div></div></section>` }
        function editProfile() { const u = S.me || {}; return `<div class="modal" id="profileModal"><div class="sheet"><div class="sheet-head"><h3>Edit your profile</h3><button class="iconbtn" onclick="closeModal()"><i class="ri-close-line"></i></button></div><div class="edit-banner" id="editBannerPreview">${u.banner_url ? `<img src="${esc(u.banner_url)}" alt="">` : ''}</div><div class="media-tools"><button onclick="pickMedia('banner')"><i class="ri-image-edit-line"></i> Change banner</button><button onclick="pickMedia('avatar')"><i class="ri-user-smile-line"></i> Change avatar</button></div><input id="mediaPicker" class="hidden" type="file" accept="image/png,image/jpeg,image/webp,image/gif" onchange="uploadMedia(this)"><div style="display:flex;align-items:center;gap:12px;margin-top:15px"><div class="preview-avatar" id="editAvatarPreview">${u.avatar_url ? `<img src="${esc(u.avatar_url)}" alt="">` : `<span>${initials(u)}</span>`}</div><div><b>Your photo</b><div class="muted" style="font-size:10px;margin-top:3px">Square works best. Nura will preserve the crop.</div></div></div><form class="form-grid" onsubmit="saveProfile(event)"><div class="field"><label>Display name</label><input id="p-name" value="${esc(u.display_name || '')}"></div><div class="field"><label>Username</label><input id="p-user" value="${esc(u.username || '')}"></div><div class="field"><label>Bio</label><textarea id="p-bio">${esc(u.bio || '')}</textarea></div><div class="field"><label>Instagram</label><input id="p-instagram" type="url" value="${esc(u.instagram_url || '')}" placeholder="https://instagram.com/..." ></div><div class="field"><label>X</label><input id="p-x" type="url" value="${esc(u.x_url || '')}" placeholder="https://x.com/..." ></div><div class="field"><label>LinkedIn</label><input id="p-linkedin" type="url" value="${esc(u.linkedin_url || '')}" placeholder="https://linkedin.com/in/..." ></div><div class="field"><label>Website</label><input id="p-web" type="url" value="${esc(u.website_url || '')}" placeholder="https://example.com" ></div><button class="btn primary" style="width:100%">Save changes</button></form></div></div>` }
        function newChat() { return `<div class="modal" id="newChatModal"><div class="sheet"><div class="sheet-head"><h3>New conversation</h3><button class="iconbtn" onclick="closeModal()"><i class="ri-close-line"></i></button></div><div class="search" style="margin:0 0 10px"><i class="ri-search-line muted"></i><input oninput="searchUsers(this.value,'newUsers')" placeholder="Search people..."></div><div id="newUsers"></div></div></div>` }
        function chatPage() { const c = S.activeChat || {}; const o = c.other || {}; const editing = S.editing; return `<div class="chat-page"><header class="chat-headbar safe-top"><button class="iconbtn" onclick="closeChat()"><i class="ri-arrow-left-line"></i></button>${avatar(o, 'av-sm')}<div class="chat-user"><strong>${esc(o.display_name || c.title || 'Conversation')}</strong><small>${o.last_seen && Date.now() - Date.parse(o.last_seen) < 120000 ? 'online' : o.last_seen ? 'last seen ' + time(o.last_seen) : 'Nura user'}</small></div><button class="iconbtn" onclick="viewUser(${o.id || 0})"><i class="ri-information-line"></i></button></header><main class="messages" id="messages"></main><div class="composer-wrap"><div id="typing" class="typing hidden">typing…</div>${S.replyTo ? `<div class="reply-bar"><i class="ri-reply-line" style="color:var(--primary)"></i><div class="grow"><b>Replying to ${esc(S.replyTo.display_name || 'User')}</b><span>${esc(S.replyTo.body || S.replyTo.attachment_name || 'Attachment')}</span></div><button class="iconbtn" style="width:32px;height:32px" onclick="clearReply()"><i class="ri-close-line"></i></button></div>` : ''}${editing ? `<div class="reply-bar"><i class="ri-edit-line" style="color:var(--primary)"></i><div class="grow"><b>Editing message</b><span>${esc(editing.body || '')}</span></div><button class="iconbtn" style="width:32px;height:32px" onclick="cancelEdit()"><i class="ri-close-line"></i></button></div>` : ''}<div class="composer"><input id="chat-file" class="hidden" type="file" accept="image/png,image/jpeg,image/webp,application/pdf,text/plain" onchange="sendSelectedFile(this)"><button class="compose-btn" onclick="$('#chat-file').click()" title="Attach"><i class="ri-add-line"></i></button><button class="compose-btn" onclick="toggleEmoji()" title="Emoji"><i class="ri-emotion-line"></i></button><textarea id="composerText" rows="1" oninput="autoGrow(this)" onkeydown="composerKey(event)" placeholder="${editing ? 'Edit your message…' : 'Message ' + esc(o.display_name || '') + '…'}"></textarea><button class="compose-btn" id="voiceBtn" onclick="toggleVoice()" title="Voice"><i class="ri-mic-line"></i></button><button class="compose-btn send-btn" onclick="sendMessage()" title="Send"><i class="ri-send-plane-2-fill"></i></button></div>${S.emoji ? emojiPanel() : ''}</div></div>` }
        function emojiPanel() { const e = ['😀', '😂', '🥹', '😍', '🥰', '😘', '😎', '🤍', '🩷', '❤️', '🔥', '✨', '🎉', '😮', '😢', '😡', '👍', '👎', '👏', '🙏', '🤝', '💯', '🚀', '☕', '🎧', '🎸', '🫶', '👀', '💀', '😭', '🤌', '🫡']; return `<div class="emoji-panel glass-light">${e.map(x => `<button onclick="insertEmoji('${x}')">${x}</button>`).join('')}</div>` }
        function renderMessages() { const root = $('#messages'); if (!root) return; let last = ''; root.innerHTML = S.messages.length ? S.messages.map(m => { const d = dateLabel(m.created_at), sep = d !== last ? (last = d, `<div class="date-chip">${d}</div>`) : ''; let body = ''; if (m.reply_to_id && m.reply_body) body += `<div class="reply-preview"><b>${esc(m.reply_sender || 'Reply')}</b><span>${esc(m.reply_body)}</span></div>`; if (m.message_type === 'image' && m.attachment_url) body += `<img class="attach-img" src="${esc(m.attachment_url)}" alt="">`; else if (m.message_type === 'file' && m.attachment_url) body += `<a class="file-pill" href="${esc(m.attachment_url)}" target="_blank"><i class="ri-file-3-line"></i><span>${esc(m.attachment_name || 'File')}</span></a>`; else if (m.message_type === 'audio' && m.attachment_url) body += `<div class="audio-row"><i class="ri-mic-2-line"></i><audio controls src="${esc(m.attachment_url)}"></audio></div>`; if (m.body) body += `<div>${esc(m.body).replace(/\n/g, '<br>')}</div>`; return sep + `<article class="msg ${m.mine ? 'mine' : 'theirs'}" data-id="${m.id}" oncontextmenu="messageMenu(event,${m.id})" ontouchstart="touchStart(event,${m.id})" ontouchend="touchEnd()"><div class="bubble">${m.is_pinned ? '<span class="pin-mini"><i class="ri-pushpin-fill"></i></span>' : ''}${body}</div><div class="msg-time">${time(m.created_at)} ${m.edited_at ? '· edited' : ''} ${m.mine ? '<span style="color:#86e3a6">✓✓</span>' : ''}</div></article>` }).join('') : `<div class="empty"><i class="ri-chat-3-line"></i><h3>No messages yet</h3><p>Send the first little hello.</p></div>`; root.scrollTop = root.scrollHeight }
        function autoGrow(el) { el.style.height = '42px'; el.style.height = Math.min(el.scrollHeight, 110) + 'px' } function composerKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage() } } function toggleEmoji() { S.emoji = !S.emoji; render(); if (S.view === 'chat') { const x = $('#composerText'); if (x) x.focus() } } function insertEmoji(e) { const x = $('#composerText'); if (!x) return; x.value += e; autoGrow(x); x.focus() }
        let touchMid = null, touchTimer = null; function touchStart(e, id) { touchMid = id; clearTimeout(touchTimer); touchTimer = setTimeout(() => messageMenu(e, id), 520) } function touchEnd() { clearTimeout(touchTimer) }
        function messageMenu(e, id) { e?.preventDefault?.(); const m = S.messages.find(x => x.id === id); if (!m) return; document.querySelector('.context')?.remove(); const x = (e?.clientX ?? window.innerWidth / 2), y = (e?.clientY ?? window.innerHeight / 2); const items = [`<button onclick="replyMessage(${id})"><i class="ri-reply-line"></i>Reply</button>`, `<button onclick="togglePin(${id})"><i class="ri-pushpin-line"></i>${m.is_pinned ? 'Unpin' : 'Pin'}</button>`]; if (m.mine && m.message_type === 'text') items.push(`<button onclick="editMessageStart(${id})"><i class="ri-edit-2-line"></i>Edit</button>`); if (m.mine) items.push(`<button class="danger" onclick="deleteMessage(${id})"><i class="ri-delete-bin-line"></i>Delete</button>`); const el = document.createElement('div'); el.className = 'context'; el.innerHTML = items.join(''); el.style.left = Math.min(x, window.innerWidth - 200) + 'px'; el.style.top = Math.min(y, window.innerHeight - 210) + 'px'; document.body.appendChild(el); setTimeout(() => document.addEventListener('click', () => el.remove(), { once: true }), 10) }
        function replyMessage(id) { const m = S.messages.find(x => x.id === id); if (!m) return; S.replyTo = m; S.editing = null; document.querySelector('.context')?.remove(); render(); requestAnimationFrame(() => $('#composerText')?.focus()) } function clearReply() { S.replyTo = null; render() } function editMessageStart(id) { const m = S.messages.find(x => x.id === id); if (!m) return; S.editing = m; S.replyTo = null; document.querySelector('.context')?.remove(); render(); requestAnimationFrame(() => { const x = $('#composerText'); if (x) { x.value = m.body || ''; autoGrow(x); x.focus() } }) } function cancelEdit() { S.editing = null; render() }
        async function togglePin(id) { document.querySelector('.context')?.remove(); try { const r = await api('toggle_pin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message_id: id }) }); await pollChat(); toast(r.pinned ? 'Pinned message' : 'Unpinned message') } catch (e) { toast(e.message) } }
        async function deleteMessage(id) { document.querySelector('.context')?.remove(); if (!confirm('Delete this message?')) return; try { await api('delete_message', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message_id: id }) }); await pollChat(); toast('Message deleted') } catch (e) { toast(e.message) } }
        async function sendMessage() { if (S.editing) { const x = $('#composerText'); const body = x?.value.trim(); if (!body) return; try { await api('edit_message', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message_id: S.editing.id, body }) }); S.editing = null; x.value = ''; await pollChat() } catch (e) { toast(e.message) } return } const x = $('#composerText'); const body = x?.value.trim(); if (!body) return; try { await api('send_message', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ conversation_id: S.activeChat.id, body, message_type: 'text', reply_to_id: S.replyTo?.id || null }) }); S.replyTo = null; x.value = ''; x.style.height = '42px'; S.emoji = false; await pollChat() } catch (e) { toast(e.message) } }
        async function sendSelectedFile(input) { const f = input.files?.[0]; if (!f) return; try { const fd = new FormData(); fd.append('conversation_id', S.activeChat.id); fd.append('file', f); await api('upload_chat_media', { method: 'POST', body: fd }); input.value = ''; await pollChat(); toast('Attachment sent') } catch (e) { toast(e.message) } }
        async function toggleVoice() { if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) { toast('Voice recording is not supported here'); return } if (S.recording) { S.recording.stop(); return } try { const stream = await navigator.mediaDevices.getUserMedia({ audio: true }); const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm'; const rec = new MediaRecorder(stream, { mimeType: mime }); S.recording = rec; S.recordChunks = []; S.recordStarted = Date.now(); $('#voiceBtn').innerHTML = '<i class="ri-stop-circle-line"></i>'; rec.ondataavailable = e => { if (e.data.size) S.recordChunks.push(e.data) }; rec.onstop = async () => { stream.getTracks().forEach(t => t.stop()); S.recording = null; $('#voiceBtn')?.replaceChildren(Object.assign(document.createElement('i'), { className: 'ri-mic-line' })); const blob = new Blob(S.recordChunks, { type: mime }); const file = new File([blob], 'voice-' + Date.now() + '.webm', { type: 'audio/webm' }); try { const fd = new FormData(); fd.append('conversation_id', S.activeChat.id); fd.append('file', file); await api('upload_chat_media', { method: 'POST', body: fd }); await pollChat(); toast('Voice message sent') } catch (e) { toast(e.message) } }; rec.start(); toast('Recording… tap mic again to stop') } catch (e) { toast('Microphone permission was denied') } }
        async function openChat(id) { try { const c = S.chats.find(x => x.id === id); S.activeChat = c || { id }; const r = await api('chat', { qs: { id } }); if (!S.activeChat.other) { await loadChats(); S.activeChat = S.chats.find(x => x.id === id) || S.activeChat } S.messages = r.messages || []; S.view = 'chat'; S.replyTo = null; S.editing = null; render(); startPoll() } catch (e) { toast(e.message) } }
        async function pollChat() { if (!S.activeChat) return; try { const r = await api('chat', { qs: { id: S.activeChat.id } }); const oldLast = S.messages.at(-1)?.id; S.messages = r.messages || []; renderMessages(); if (S.messages.at(-1)?.id !== oldLast) renderMessages() } catch (e) { } }
        function startPoll() { stopPoll(); S.poll = setInterval(pollChat, 2200) } function stopPoll() { if (S.poll) clearInterval(S.poll); S.poll = null }
        function closeChat() { stopPoll(); S.view = 'main'; S.activeChat = null; S.replyTo = null; S.editing = null; render() }
        function openNewChat() { document.body.insertAdjacentHTML('beforeend', newChat()) } function closeModal() { document.querySelector('.modal')?.remove() } async function startChat(id) { try { const r = await api('create_direct', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user_id: id }) }); closeModal(); await loadChats(); await openChat(r.conversation_id) } catch (e) { toast(e.message) } }
        async function loadChats() { try { const r = await api('list_chats'); S.chats = r.chats || []; renderChatRows() } catch (e) { toast(e.message) } } async function refreshChats() { await loadChats(); toast('Chats refreshed') }
        function go(t) { stopPoll(); S.tab = t; S.view = 'main'; S.search = ''; render(); if (t === 'chats') loadChats() }
        async function openProfileEdit() { document.body.insertAdjacentHTML('beforeend', editProfile()) } let selectedKind = 'avatar'; function pickMedia(kind) { selectedKind = kind; $('#mediaPicker').click() }
        async function uploadMedia(input) { const f = input.files?.[0]; if (!f) return; try { const fd = new FormData(); fd.append('kind', selectedKind); fd.append('file', f); const r = await api('upload_profile_media', { method: 'POST', body: fd }); const me = await api('me'); S.me = me.user; document.querySelector('#profileModal')?.remove(); render(); toast(selectedKind === 'banner' ? 'Banner updated' : 'Avatar updated') } catch (e) { toast(e.message) } finally { input.value = '' } }
        async function saveProfile(e) { e.preventDefault(); try { const r = await api('update_profile', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: $('#p-user').value.trim(), display_name: $('#p-name').value.trim(), bio: $('#p-bio').value.trim(), instagram_url: $('#p-instagram').value.trim(), x_url: $('#p-x').value.trim(), linkedin_url: $('#p-linkedin').value.trim(), website_url: $('#p-web').value.trim() }) }); S.me = r.user; closeModal(); render(); toast('Profile saved') } catch (err) { toast(err.message) } }
        async function viewUser(id) { const u = S.activeChat?.other; if (!id || !u) return; document.body.insertAdjacentHTML('beforeend', `<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet center"><div class="sheet-head"><h3>Profile</h3><button class="iconbtn" onclick="closeModal()"><i class="ri-close-line"></i></button></div><div class="profile-hero" style="margin:0"><div class="banner" style="height:145px">${u.banner_url ? `<img src="${esc(u.banner_url)}">` : ''}</div><div class="profile-head"><div class="profile-avatar-wrap" style="margin-top:-42px"><div class="profile-avatar" style="width:78px;height:78px;border-radius:25px">${u.avatar_url ? `<img src="${esc(u.avatar_url)}">` : `<span>${initials(u)}</span>`}</div></div><div class="profile-name" style="font-size:23px">${esc(u.display_name)}</div><div class="profile-handle">@${esc(u.username)}</div><p class="bio">${esc(u.bio || 'No bio yet.')}</p><div class="social-row">${u.instagram_url ? `<a class="social" href="${esc(u.instagram_url)}" target="_blank">Instagram</a>` : ''}${u.x_url ? `<a class="social" href="${esc(u.x_url)}" target="_blank">X</a>` : ''}${u.linkedin_url ? `<a class="social" href="${esc(u.linkedin_url)}" target="_blank">LinkedIn</a>` : ''}${u.website_url ? `<a class="social" href="${esc(u.website_url)}" target="_blank">Website</a>` : ''}</div></div></div></div></div>`) }
        function togglePw(id, b) { const x = $('#' + id); x.type = x.type === 'password' ? 'text' : 'password'; b.innerHTML = x.type === 'password' ? '<i class="ri-eye-line"></i>' : '<i class="ri-eye-off-line"></i>' }
        async function login(e) { e.preventDefault(); try { const r = await api('login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ identity: $('#login-id').value.trim(), password: $('#login-pw').value }) }); S.me = r.user; S.tab = 'chats'; S.view = 'main'; render(); await loadChats(); toast('Welcome back ✨') } catch (err) { toast(err.message) } }
        async function register(e) { e.preventDefault(); try { const r = await api('register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: $('#reg-user').value.trim(), display_name: $('#reg-name').value.trim(), password: $('#reg-pw').value, bio: $('#reg-bio').value.trim() }) }); S.me = r.user; S.tab = 'chats'; S.view = 'main'; render(); toast('Your Nura account is ready ✨') } catch (err) { toast(err.message) } }
        async function logout() { stopPoll(); await api('logout'); S.me = null; S.tab = 'chats'; S.view = 'main'; render() }
        function render() { const app = $('#app'); app.innerHTML = S.me ? (S.view === 'chat' ? chatPage() : shell()) : authView(); if (S.me && S.view !== 'chat' && S.tab === 'chats') renderChatRows(); if (S.view === 'chat') renderMessages() }
        async function boot() { try { const r = await api('me'); if (r.authenticated) { S.me = r.user; render(); await loadChats() } else render() } catch (e) { render(); toast(e.message) } }
        window.S = S; window.$ = $; window.render = render; window.login = login; window.register = register; window.togglePw = togglePw; window.logout = logout; window.go = go; window.refreshChats = refreshChats; window.openNewChat = openNewChat; window.closeModal = closeModal; window.searchUsers = searchUsers; window.startChat = startChat; window.openChat = openChat; window.closeChat = closeChat; window.sendMessage = sendMessage; window.composerKey = composerKey; window.openProfileEdit = openProfileEdit; window.pickMedia = pickMedia; window.saveProfile = saveProfile; window.viewUser = viewUser; window.toggleEmoji = toggleEmoji; window.insertEmoji = insertEmoji; window.messageMenu = messageMenu; window.touchStart = touchStart; window.touchEnd = touchEnd; window.replyMessage = replyMessage; window.clearReply = clearReply; window.editMessageStart = editMessageStart; window.cancelEdit = cancelEdit; window.togglePin = togglePin; window.deleteMessage = deleteMessage; window.sendSelectedFile = sendSelectedFile; window.toggleVoice = toggleVoice; window.autoGrow = autoGrow;
        boot();
    </script>
